[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strava-recommender"
version = "0.1.0"
description = "ML-powered cycling route recommender based on Strava activities and weather conditions"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
strava-recommender = "strava_recommender.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv.workspace]
members = [
    "llm_fun",
]
